spring.application.name=acervo

# Senhas e ajustes da maquina ficam em application-local.properties (fora do Git).
# Modelo: application-local.properties.exemplo
spring.config.import=optional:classpath:application-local.properties

# Conexao MySQL (o banco e criado pelo script db/dipred_acervo_db.sql)
spring.datasource.url=jdbc:mysql://localhost:3306/dipred_acervo_db?serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:dipred_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracao JPA (as tabelas vem do script; o Hibernate so confere)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=8083

# Envio de arquivos (pranchas DWG/RVT podem ser grandes)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# Raiz da estrutura de pastas dos arquivos (relativa a pasta do projeto, ou caminho absoluto no servidor)
acervo.arquivos.raiz=Estrutura de Pastas

# Senha do gestor "admin", criado ao iniciar quando ainda nao existe
acervo.admin.senha-inicial=${ACERVO_ADMIN_SENHA:}
