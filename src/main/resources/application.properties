spring.application.name=acervo

# Conexao MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/dipred_acervo_db?createDatabaseIfNotExist=true&serverTimezone=UTC
# Usuario e senha vem de variaveis de ambiente (nao ficam no repositorio)
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracao JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=8083

# Banco desligado por enquanto (ainda nao ha entidades e o dipred_user nao tem acesso ao dipred_acervo_db).
# Para ligar: dar o GRANT no MySQL e apagar a linha abaixo.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
