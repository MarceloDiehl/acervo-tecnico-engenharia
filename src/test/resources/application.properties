spring.application.name=acervo

# Testes automaticos: banco H2 em memoria (modo MySQL), sem precisar do MySQL
spring.datasource.url=jdbc:h2:mem:acervo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# arquivos gravados durante os testes
acervo.arquivos.raiz=target/teste-arquivos
acervo.admin.senha-inicial=
